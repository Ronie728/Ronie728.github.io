name: Canvas sync

# 每 30 分钟拉一次 Canvas 事实数据（作业 + 小测），有变化才提交。
# 香港时间 07:00–23:30 运行（UTC 23:00 + 0:00–15:30）。
on:
  schedule:
    - cron: '*/30 0-15,23 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '重拉小测逐题明细（更慢）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: canvas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Canvas facts
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          DATA_PATH: cd-8f4k2q/data/data.json
        run: |
          if [ -z "$CANVAS_TOKEN" ]; then
            echo "::error::secrets.CANVAS_TOKEN 未设置，跳过（去 Settings → Secrets → Actions 添加）"
            exit 0
          fi
          python tools/canvas_sync.py --data "$DATA_PATH" ${{ inputs.full && '--full' || '' }}

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name  "campusdesk-bot"
          git config user.email "campusdesk-bot@users.noreply.github.com"
          git add cd-8f4k2q/data/data.json
          git commit -m "sync canvas $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            echo "push retry $i"; sleep 5
          done
