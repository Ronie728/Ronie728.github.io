    <!--
      这个 404 页是 GitHub Pages 唯一的 SPA 兜底，两个站点共用：

      跳转前先把 App 的入口 JS/CSS 拉进 HTTP 缓存，刷新深链接时首屏省一个往返。
      hash 过期只会多下一次无用文件，不影响正确性（meta refresh 兜底不受影响）。
    -->
    <link rel="modulepreload" as="script" href="/cd-8f4k2q/assets/index-CWb8SoKv.js" />
    <link rel="preload" as="style" href="/cd-8f4k2q/assets/index-2MUZ2kGm.css" />
    <script>
      (function () {
        var BASE = '/cd-8f4k2q/';
        var p = location.pathname || '/';
        if (p.indexOf(BASE) === 0) return; // 让 meta refresh 把它送回 CampusDesk
        location.replace('/' + location.search + location.hash);
      })();
    </script>

      html, body { margin: 0; height: 100%; }
