    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EEFA" />
    <!--
      防收录 / 防泄露：这是个人私密站点，不希望被搜索引擎、AI 爬虫或
      预览机器人抓到。noindex 让搜索结果不出现，nofollow 让爬虫不顺着链接爬，
      noarchive/nosnippet 禁止快照与摘要，noimageindex 禁止图片被收录。
      robots.txt 里另写了一份给爬虫看的规则；两者一起才稳妥。
      注意：这只能挡住「守规矩」的爬虫，挡不住知道链接的人直接打开——
      真正的访问控制仍靠门禁码（src/lib/lock.js）。
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="bingbot" content="noindex, nofollow, noarchive" />
    <meta name="slurp" content="noindex, nofollow" />
    <meta name="duckduckbot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!--
      v1.5.2 内容安全策略（CSP）。GitHub Pages 发不了响应头，只能用 meta 声明；
      效果是给页面上一把「白名单锁」：
        - default-src 'self'   → 只有本站资源能加载，第三方脚本/图片/字体一律拒绝，
                                 就算有人想办法往页面里塞了 <script> 也执行不了；
        - object-src 'none'    → 禁掉 <embed>/<object>/Flash 一类插件载体；
        - base-uri 'self'      → 防止有人注入 <base> 把相对路径劫持到别的域名；
        - form-action 'none'   → 本页没有表单，直接禁掉表单提交（防数据被 POST 出去）；
        - connect-src 放行天气接口与学校 Canvas 域名，其余一律拦截。
          （v1.6.0 曾放行云同步数据面 campusdesk.app.workbuddy.host；v1.6.1 收回——
          云服务端只接受其自有发布域名的跨域请求，GitHub Pages 登录必被 CORS 拦，
          入口已撤，域名不再放行，保持白名单最小化。）
      ⚠️ script-src / style-src 必须留 'unsafe-inline'：本文件底部有一段自愈内联脚本，
      React 也会写内联 style，去掉它们会直接白屏。
      ⚠️ frame-ancestors 在 meta 里是无效的（CSP 规范如此），要防嵌套只能靠响应头。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://cityu-dg.instructure.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />

    <!--
      v1.4.2 自愈脚本：旧网址（ronie728.github.io/）的 PWA 曾把 Service Worker 注册在
      根作用域，它会连本 App 的导航请求一起截住、返回它自己缓存的旧页面（用户看到
      v1.2.2 / v1.3.9）。只要本页真的被加载成功，就把一切不属于本路径的 Service Worker
      和缓存清干净再刷新一次；本机平安无事时它什么也不做（Session 内只跑一次）。
    -->
    <script>
      (function () {
        var BASE = '/cd-8f4k2q/';
        try {
          if (sessionStorage.getItem('wb_cd_cleaned')) return;
        } catch (e) {}
        if (!('serviceWorker' in navigator) || location.pathname.indexOf(BASE) !== 0) return;
        var mine = location.origin + BASE;
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            var foreign = regs.filter(function (r) {
              return r.scope !== mine;
            });
            if (!foreign.length) return false;
            return Promise.all(
              foreign.map(function (r) {
                return r.unregister();
              })
            ).then(function () {
              return true;
            });
          })
          .then(function (dirty) {
            if (!window.caches) return dirty;
            return caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return k.indexOf(BASE) === -1 ? caches.delete(k) : Promise.resolve(false);
                })
              );
            }).then(function () {
              return dirty;
            });
          })
          .then(function (dirty) {
            if (!dirty) return;
            try {
              sessionStorage.setItem('wb_cd_cleaned', '1');
            } catch (e) {}
            location.reload();
          })
          .catch(function () {});
      })();
    </script>
