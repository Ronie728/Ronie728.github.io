<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Nothing here</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; background: #ffffff; color: #9ca3af; font: 500 15px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
    </style>
  </head>
  <body>Nothing here.</body>
  <!--
    This domain used to host an old build; its service worker was registered at the root scope
    and keeps hijacking the new app's navigation requests. Whenever this root page is actually
    served, evict every service worker and cache left behind on this origin.
  -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).catch(function () {});
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
</html>
